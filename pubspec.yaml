name: weather_app
description: Mausam, a weather app with live conditions, forecasts and air quality for any place.
publish_to: "none"

version: 2.0.0+2

environment:
  sdk: ^3.8.0

dependencies:
  auto_route: ^11.2.0
  dartz: ^0.10.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.2
  fluttertoast: ^10.0.2
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.1
  get_it: ^9.3.0
  google_fonts: 8.0.0
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  line_icons: ^2.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  auto_route_generator: ^10.6.0
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/weee.png


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
 